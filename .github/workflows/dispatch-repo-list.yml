name: Dispatch repo-list

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CROSS_REPO_TOKEN:
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled repository task
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh workflow run scheduled.yml \
            --repo svevang/repo-list \
            --ref main \
            --raw-field source_repository="${GITHUB_REPOSITORY}" \
            --raw-field source_run_id="${GITHUB_RUN_ID}" \
            --raw-field source_run_url="${SOURCE_RUN_URL}"
